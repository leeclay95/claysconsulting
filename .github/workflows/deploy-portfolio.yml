name: Deploy portfolio to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-portfolio.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: portfolio

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CHECKS GATE: must pass before any deploy step runs.

      - name: Generate Worker types
        run: npx wrangler types

      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      # DEPLOY: only after the gate above is green.

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portfolio
          command: deploy

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portfolio
          command: versions upload
